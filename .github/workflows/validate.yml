name: Validate AI workspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check catalog and generated skills
        run: python3 scripts/check_repo.py
      - name: Test profile switching and preservation of local files
        run: python3 -m unittest discover -s tests -v
