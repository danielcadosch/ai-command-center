name: Validate AI workspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check catalog and generated skills
        run: python3 scripts/check_repo.py
      - name: Test profile switching and preservation of local files
        run: python3 -m unittest discover -s tests -v
